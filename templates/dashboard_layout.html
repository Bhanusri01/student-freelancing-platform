{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Qurikly</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="flex min-h-screen">

    
    <aside class="w-64 bg-gray-800 text-gray-200 flex flex-col">

        <!-- Logo -->
        <div class="p-6 text-2xl font-bold text-teal-400 border-b border-gray-700">
            Qurikly
        </div>

        <!-- Menu -->
        <nav class="flex-1 p-6 space-y-2">

            <a href="{% url 'dashboard' %}"
               class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 hover:text-teal-400 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.5h6v7H3v-7zm6-10h6v17H9v-17zm6 6h6v11h-6V9.5z" />
                </svg>
                <span>Dashboard</span>
            </a>

            {% if request.user.user_type == 'student' %}

                <a href="{% url 'create_gig' %}"
                   class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 hover:text-teal-400 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14" />
                    </svg>
                    <span>Create Gig</span>
                </a>

                <a href="{% url 'freelancer_profile' request.user.id %}"
                   class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 hover:text-teal-400 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6.75a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.25a7.5 7.5 0 0115 0" />
                    </svg>
                    <span>My Profile</span>
                </a>

            {% endif %}

            {% if request.user.user_type == 'client' %}
                <a href="{% url 'client_profile' request.user.id %}"
                   class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 hover:text-teal-400 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6.75a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.25a7.5 7.5 0 0115 0" />
                    </svg>
                    <span>My Profile</span>
                </a>
            {% endif %}

            <a href="{% url 'my_orders' %}"
               class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 hover:text-teal-400 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 7.5h16.5M6.75 3.75h10.5a3 3 0 013 3v10.5a3 3 0 01-3 3H6.75a3 3 0 01-3-3V6.75a3 3 0 013-3z" />
                </svg>
                <span>Orders</span>
            </a>

            <a href="{% url 'wallet' %}"
               class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 hover:text-teal-400 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12V8.25A2.25 2.25 0 0018.75 6H5.25A2.25 2.25 0 003 8.25v7.5A2.25 2.25 0 005.25 18h13.5A2.25 2.25 0 0021 15.75V12zm0 0h-4.5a1.5 1.5 0 100 3H21v-3z" />
                </svg>
                <span>Wallet</span>
            </a>

            <a href="{% url 'my_conversations' %}"
               class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 hover:text-teal-400 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3h5.25m-8.25 8.25V6.75A2.25 2.25 0 016.75 4.5h10.5a2.25 2.25 0 012.25 2.25v7.5a2.25 2.25 0 01-2.25 2.25H9l-4.5 3z" />
                </svg>
                <span>Messages</span>
            </a>

        </nav>

        <!-- Logout -->
        <div class="p-6 border-t border-gray-700">
            <a href="{% url 'logout' %}"
               class="flex items-center gap-3 px-3 py-2 rounded-lg text-red-400 hover:bg-gray-700 hover:text-red-500 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6A2.25 2.25 0 005.25 5.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m-6-3h11.25m0 0l-3-3m3 3l-3 3" />
                </svg>
                <span>Logout</span>
            </a>
        </div>

    </aside>



    
    <main class="flex-1 p-10">

        {% block content %}
        {% endblock %}

    </main>

</div>

</body>
</html>
