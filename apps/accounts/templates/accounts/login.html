{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="min-h-screen bg-gradient-to-b from-slate-100 via-slate-100 to-slate-200 py-12 px-4">
    <div class="max-w-5xl mx-auto">
        <div class="grid lg:grid-cols-2 overflow-hidden rounded-3xl shadow-2xl border border-slate-200">
            <div class="bg-slate-900 relative min-h-80 lg:min-h-full">
                <img src="{% static 'accounts/images/login_pic.jpg' %}" alt="Qurikly login visual"
                     class="absolute inset-0 w-full h-full object-cover">
            </div>

            <div class="bg-white p-8 md:p-10">
                <h2 class="text-2xl font-bold text-slate-800">Login</h2>
                <p class="text-slate-500 mt-2">Enter your credentials to continue.</p>

                {% if error_message %}
                    <div class="mt-5 rounded-xl border border-rose-200 bg-rose-50 text-rose-700 px-4 py-3 text-sm">
                        {{ error_message }}
                    </div>
                {% endif %}

                <form method="post" class="mt-6 space-y-5">
                    {% csrf_token %}

                    <div>
                        <label for="id_username" class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                        <input id="id_username" type="text" name="username" required
                               class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                    </div>

                    <div>
                        <label for="id_password" class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                        <input id="id_password" type="password" name="password" required
                               class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                    </div>

                    <button type="submit"
                            class="w-full bg-teal-600 hover:bg-teal-700 text-white py-3 rounded-xl font-semibold transition">
                        Login
                    </button>
                </form>

                <p class="text-sm text-slate-500 mt-6">
                    New to Qurikly?
                    <a href="{% url 'register' %}" class="text-teal-700 font-semibold hover:underline">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
