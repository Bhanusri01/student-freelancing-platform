{% extends "dashboard_layout.html" %}

{% block content %}

<section class="max-w-4xl mx-auto">

    <h1 class="text-3xl font-bold mb-8">
        Messages
    </h1>

    <div class="bg-white rounded-2xl shadow-lg p-8">

        {% for convo in conversations %}
            <a href="{% url 'chat_view' convo.id %}"
               class="block p-5 border-b hover:bg-purple-50 rounded-xl transition">

                <p class="font-semibold text-gray-800">
                    {% if request.user == convo.client %}
                        {{ convo.freelancer.username }}
                    {% else %}
                        {{ convo.client.username }}
                    {% endif %}
                </p>

            </a>
        {% empty %}
            <p class="text-gray-400 text-center py-6">
                No conversations yet.
            </p>
        {% endfor %}

    </div>

</section>

{% endblock %}
